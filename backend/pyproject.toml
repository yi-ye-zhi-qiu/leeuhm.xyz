[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Liam Isaacs", email = "yeqiu194@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "jsonlines>=4.0.0",
    "jsonschema>=4.26.0",
    "psycopg>=3.3.6",
    "psycopg2>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "scrapy>=2.19.0",
    "scrapy-impersonate>=1.10.0",
    "spidermon[monitoring]>=1.27.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
